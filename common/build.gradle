architectury {
    common(rootProject.enabled_platforms.split(","))
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"

    // FTBUltimine + FTB Library — compile-only; platform modules provide them at runtime
    modCompileOnly "curse.maven:ftb-ultimine-forge-386134:${rootProject.ftbultimine_forge_file_id}"
    modCompileOnly "curse.maven:ftb-library-forge-404465:${rootProject.ftblibrary_forge_file_id}"
}
